appId: org.kaida.autoquiz
productName: 开大智达舱
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
extraResources:
  - from: ${env.KAIDA_BROWSER_DIR}
    to: browsers
directories:
  output: release
publish:
  provider: github
  owner: zmjza
  repo: SmartAnswerPod
mac:
  icon: build/icon.png
  identity: "-"
  requirements: build/requirements.mac.txt
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
    - zip
  artifactName: kaida-auto-quiz-${version}-macOS.${ext}
win:
  icon: build/icon.png
  target:
    - nsis
  artifactName: kaida-auto-quiz-${version}-Windows.${ext}
nsis:
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 开大智达舱
asar: true
asarUnpack:
  - node_modules/playwright/**/*
  - node_modules/playwright-core/**/*
  - node_modules/patchright/**/*
  - node_modules/patchright-core/**/*
